<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrindo o UDIkey…</title>
  <meta name="robots" content="noindex">
  <!--
    udikey.com/app (2026-10-08): o link que vai no WhatsApp dos chaveiros ("tem pedido,
    fique online"). Nenhum link https abre direto a tela de ficar online nas builds que
    estão nas lojas, então esta página só abre o app pelo esquema udikey://: o app, na
    raiz, já leva o chaveiro logado para a área dele, onde fica o botão de ficar online.
    O script fica em /app.js porque o CSP do site é script-src 'self' (nada inline).
    Sem /t.js de propósito: quem chega aqui é chaveiro, e o clique em udikey:// contaria
    como "clique_baixar" nos números de divulgação dos creators.
  -->
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #12100B; color: #F5EFE2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .logo { color: #F0C457; font-weight: 900; letter-spacing: 2px; font-size: 13px; margin-bottom: 10px; }
    h1 { font-size: 21px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
    p { color: #B8AE99; font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: block; width: 100%; padding: 15px 16px; border-radius: 14px;
      font-size: 15px; font-weight: 800; text-decoration: none; margin-bottom: 10px;
      background: #F0C457; color: #1A1206;
    }
    .btn.sec { background: transparent; color: #F0C457; border: 1.5px solid rgba(240,196,87,.5); }
    .rodape { color: #6E6653; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">UDIKEY</div>
    <h1 id="titulo">Abrindo o UDIkey…</h1>
    <p id="texto">Se o app não abrir sozinho, toque no botão abaixo.</p>
    <a id="abrir" class="btn" href="udikey://">Abrir o app</a>
    <a id="play" class="btn sec" href="https://play.google.com/store/apps/details?id=com.udikey.app">Baixar na Play Store</a>
    <a id="apple" class="btn sec" href="https://apps.apple.com/br/app/udikey-chaveiro-24h/id6795719094">Baixar na App Store</a>
    <div class="rodape">udikey.com · chaveiros de confiança perto de você</div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
