<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrindo no UDIkey…</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #12100B; color: #F5EFE2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .foto {
      width: 132px; height: 132px; border-radius: 26px; object-fit: cover;
      border: 1px solid rgba(240,196,87,.35); margin-bottom: 18px;
    }
    .logo { color: #F0C457; font-weight: 900; letter-spacing: 2px; font-size: 13px; margin-bottom: 10px; }
    h1 { font-size: 21px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
    p { color: #B8AE99; font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: block; width: 100%; padding: 15px 16px; border-radius: 14px;
      font-size: 15px; font-weight: 800; text-decoration: none; margin-bottom: 10px;
      background: #F0C457; color: #1A1206;
    }
    .btn.sec { background: transparent; color: #F0C457; border: 1.5px solid rgba(240,196,87,.5); }
    .rodape { color: #6E6653; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">UDIKEY</div>
    <img id="foto" class="foto" alt="" hidden>
    <h1 id="titulo">Abrindo o serviço no app…</h1>
    <p>Se o app não abrir sozinho, use os botões abaixo.</p>
    <a id="abrir" class="btn" href="#">Abrir no app UDIkey</a>
    <a class="btn sec" href="https://play.google.com/store/apps/details?id=com.udikey.app">Baixar na Play Store</a>
    <div class="rodape">udikey.com · chaveiros de confiança perto de você</div>
  </main>
  <script>
    (function () {
      var m = location.pathname.match(/\/servico\/([A-Za-z]{3}-\d{2})/);
      var cod = m ? m[1].toUpperCase() : '';
      var deep = 'udikey://servico/' + cod;
      document.getElementById('abrir').setAttribute('href', deep);
      if (!cod) return;
      // Foto do serviço (as minis já ficam hospedadas aqui no site).
      var foto = document.getElementById('foto');
      foto.src = '/servicos-img/' + cod + '.jpg';
      foto.onload = function () { foto.hidden = false; };
      // Tenta abrir o app; se a página continuar visível (app não instalado),
      // manda pra Play Store. Se o app abriu, a aba fica oculta e nada acontece.
      var t = setTimeout(function () {
        location.href = 'https://play.google.com/store/apps/details?id=com.udikey.app';
      }, 2200);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) clearTimeout(t);
      });
      location.href = deep;
    })();
  </script>
</body>
</html>
